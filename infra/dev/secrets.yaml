---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-app-env
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: backend-app-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: dev-postgres